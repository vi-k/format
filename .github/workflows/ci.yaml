name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The reference is recorded on this hardware, so the nightly gate compares
    # like with like. Measured drift between a laptop and a runner reached
    # 16.2% on a phase mean, against a 15% tolerance — close enough that the
    # two are not interchangeable.
    - cron: '0 3 * * *'

permissions:
  contents: read

# Every action below is pinned to a commit, with its version in the comment.
# A tag is a moving reference the action's owner can repoint, so `@v5` names
# whatever that repository decides it means on the day the job runs — which is
# how a compromised release turns into arbitrary code inside this checkout. The
# comment is not decoration: Dependabot reads it, and `.github/dependabot.yml`
# schedules the updates that keep a pin from freezing out the fixes tags exist
# to deliver.

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.7.2 is the minimum the pubspec claims; stable is what the
        # repository is formatted and analyzed against. Steps that depend on
        # the current formatter or linter run on stable only.
        sdk: ['3.7.2', 'stable']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: ${{ matrix.sdk }}
      - name: Resolve dependencies
        run: dart pub get
      - name: Formatting
        if: matrix.sdk == 'stable'
        # The format16 baseline is not materialized in this job, so the
        # whole checkout must be format-clean.
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze (zero-info baseline)
        if: matrix.sdk == 'stable'
        # The full-repository pass lives in the benchmark-suite job:
        # here the suite and the format16 baseline are not resolved yet.
        run: dart analyze --fatal-infos lib test example tool
      - name: Tests (VM, includes dart2js/AOT/node runners)
        run: dart test
      - name: Tests (node platform)
        if: matrix.sdk == 'stable'
        run: >-
          dart test -p node
          test/char_sink_test.dart
          test/template_ir_compile_test.dart
          test/template_ir_diff_test.dart
          test/template_ir_fuzz_test.dart
          test/js_number_dispatch_test.dart
      - name: Tests (harness, outside the published archive)
        if: matrix.sdk == 'stable'
        run: dart test benchmark/test tool/test
      - name: Example runs
        run: dart run example/format_example.dart
      - name: Tests (format_intl)
        run: dart test
        working-directory: packages/format_intl
      - name: Published archive stands on its own
        if: matrix.sdk == 'stable'
        # Reconstructs what pub would ship and analyzes and tests it there:
        # a local pass cannot see a .pubignore that drops a referenced path.
        run: dart run tool/verify_package_archive.dart
      - name: Publish dry-run
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run

  generated-artifacts:
    # Three committed files are produced by tools rather than written, and
    # nothing about them announces that they are stale. This job regenerates
    # each one and compares; it needs an interpreter and a compiler the other
    # jobs do not, which is why it is separate rather than a step in `checks`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The generators require CPython 3.14: the fixtures record what that
          # version does, and the identifier tables come from the Unicode
          # database it ships. A patch release is tolerated, a minor one is not.
          python-version: '3.14'
      - name: Resolve dependencies
        run: dart pub get
      - name: Comparison self-test
        # A checker that reports success because it compared a file with
        # itself would look exactly like a clean repository.
        run: dart run tool/verify_generated_artifacts.dart --self-test
      - name: Generated artifacts match their generators
        run: dart run tool/verify_generated_artifacts.dart --python=python

  coverage:
    # A green run says nothing about which branches never executed. This job
    # measures, prints the per-file table worst first, and holds the total to a
    # floor. Separate from `checks` because it reruns the suite under the VM
    # service, which is slower and would double the matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable
      - name: Resolve dependencies
        run: dart pub get
      - name: Report self-test
        # A checker that reported 100% because it parsed nothing would look
        # exactly like a well-covered repository.
        run: dart run tool/check_coverage.dart --self-test
      - name: Measure
        # VM only: coverage is collected through the VM service, which dart2js
        # output has none of. The web-only branches are unreachable here by
        # construction and are pinned by the node run instead.
        run: dart test --coverage=.coverage
      - name: Convert to LCOV
        run: >-
          dart run coverage:format_coverage --lcov --in=.coverage
          --out=coverage/lcov.info --report-on=lib
          --packages=.dart_tool/package_config.json
      - name: Report and enforce the floor
        run: dart run tool/check_coverage.dart --lcov=coverage/lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Kept whether the floor held or not: the report is how the gap gets
        # closed, and it is most wanted on the run that failed.
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  benchmark-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable
      - name: Resolve root dependencies
        run: dart pub get
      - name: Materialize the format 1.6.0 baseline from pub
        run: dart run benchmark/baselines/format16/fetch.dart
      - name: Resolve suite dependencies
        run: dart pub get
        working-directory: benchmark/suite
      - name: Analyze (full repository)
        # `--fatal-infos` here as well as in `checks`, so the baseline the
        # comment above claims is the one that is actually enforced. What this
        # pass adds over that one is `benchmark/` and `benchmark/suite/`, which
        # need the format16 baseline and the suite's own dependencies resolved
        # — both done in the steps above. The vendored baselines themselves are
        # excluded in `analysis_options.yaml`, where the reason is recorded.
        run: dart analyze --fatal-infos
      - name: Tests (benchmark suite)
        run: dart test
        working-directory: benchmark/suite

  performance-gate:
    # On demand, and nightly once the schedule above is enabled: six full
    # measurement runs take minutes, and shared runners are noisy enough that
    # gating every pull request on them would cost more trust than it buys.
    #
    # Run this manually to produce the reports a first reference is recorded
    # from; see benchmark/results/README.md.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Pinned exactly: the gate rejects reports from any other Node.
          node-version: 24.8.0
      - name: Resolve dependencies
        run: dart pub get
      - name: Measure
        run: |
          set -eux
          revision="$(git rev-parse HEAD)"
          define="-Dformat.benchmark.sourceRevision=$revision"
          for run in 1 2; do
            dart run "$define" benchmark/runner.dart \
              --runtime=jit --run="$run" --output="jit-$run.json"
          done
          dart compile exe "$define" benchmark/runner.dart -o benchmark-aot
          for run in 1 2; do
            ./benchmark-aot --runtime=aot --run="$run" --output="aot-$run.json"
          done
          dart compile js -O4 \
            "-Dformat.benchmark.dartCompilerVersion=$(dart --version 2>&1 | sed -E 's/.*version: ([^ ]+).*/\1/')" \
            "$define" benchmark/runner.dart -o benchmark.js
          for run in 1 2; do
            node benchmark.js --runtime=js --run="$run" --output="js-$run.json"
          done
      - name: Evaluate against the recorded reference
        run: >-
          dart run benchmark/gates.dart
          --reports=jit-1.json,jit-2.json,aot-1.json,aot-2.json,js-1.json,js-2.json
          --baseline=benchmark/results/gate-baseline.json
          --output=gate-report.json
      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-gate
          path: |
            gate-report.json
            jit-*.json
            aot-*.json
            js-*.json
