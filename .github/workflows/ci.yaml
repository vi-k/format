name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The reference is recorded on this hardware, so the nightly gate compares
    # like with like. Measured drift between a laptop and a runner reached
    # 16.2% on a phase mean, against a 15% tolerance — close enough that the
    # two are not interchangeable.
    - cron: '0 3 * * *'

permissions:
  contents: read

# Every action below is pinned to a commit, with its version in the comment.
# A major tag is a moving reference its owner can repoint, so `@v7` names
# whatever that repository decides it means on the day the job runs — which is
# how a compromised release turns into arbitrary code inside this checkout. The
# comment is not decoration: Dependabot reads it, and `.github/dependabot.yml`
# schedules the updates that keep a pin from freezing out the fixes tags exist
# to deliver.
#
# The first such update arrived within the hour and moved four of the five
# actions two majors forward: the moving tags had been hiding the staleness,
# because `@v5` kept working while v7 existed.

jobs:
  checks:
    # Named explicitly because the matrix carries a flag as well as a version:
    # left to GitHub the job would be "checks (3.12.2, true)", and the name is
    # what other places refer to this check by.
    name: checks (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.7.2 is the minimum the pubspec claims; the second entry is what the
        # repository is formatted and analyzed against. Steps that depend on
        # the formatter or the linter run on that one only.
        #
        # Pinned to 3.12.2 rather than tracking `stable`, and the reason is not
        # caution about formatting. Dart 3.13.0 changed the dart2wasm loader —
        # `instantiate` is now a method on what `compile` returns, not an
        # export beside it — and the bootstrap `package:test` generates still
        # calls the old one, so `dart test -c dart2wasm` fails to load on every
        # file. 1.31.2 is the newest `test` published, so there is nothing to
        # upgrade to yet.
        #
        # Losing that run is not an option worth taking: it is the only place
        # the whole test tree meets real 64-bit integers on a web-shaped
        # target, and it is what caught `--9223372036854775808` when the other
        # two backends could not. Unpin as soon as `package:test` speaks the
        # new loader — the check is a one-line `dart test -c dart2wasm` on a
        # 3.13 SDK.
        # Written as `include` with an explicit flag rather than as a list of
        # versions: nine steps below run on the primary entry only, and keying
        # them on the version string meant that moving it — which this pin
        # exists to do, as soon as `package:test` speaks the new loader — would
        # silently switch off formatting, `--fatal-infos`, both web runs, the
        # harness tests, the dependency floor, the archive check and
        # `publish --dry-run`, on both legs, with the workflow still green.
        include:
          - sdk: '3.7.2'
            primary: false
          - sdk: '3.12.2'
            primary: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: ${{ matrix.sdk }}
      - name: Resolve dependencies
        run: dart pub get
      - name: Formatting
        if: matrix.primary
        # The format16 baseline is not materialized in this job, so the
        # whole checkout must be format-clean.
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze (zero-info baseline)
        if: matrix.primary
        # The full-repository pass lives in the benchmark-suite job:
        # here the suite and the format16 baseline are not resolved yet.
        run: dart analyze --fatal-infos lib test example tool
      - name: Tests (VM, includes dart2js/AOT/node runners)
        run: dart test
      # The whole suite on both web backends, not a hand-picked list of files.
      # The list was the thing that hid a defect: dart2wasm is the third
      # web-shaped target and it does not answer like dart2js, because its
      # integers are real 64-bit ones. Exactly that combination — the web
      # string path over 64-bit integers — printed `--9223372036854775808` for
      # the minimum int, and no job here could see it.
      #
      # What a backend genuinely cannot run says so in the file: `@TestOn('vm')`
      # where the fixtures are files, `skip:` where an assertion pins the VM's
      # number model, and the `no-dart2wasm` tag on the one file that crashes
      # inside `package:test` rather than in this package.
      - name: Tests (node platform, dart2js)
        if: matrix.primary
        run: dart test -p node
      - name: Tests (node platform, dart2wasm)
        if: matrix.primary
        run: dart test -p node -c dart2wasm -x no-dart2wasm
      - name: Tests (harness, outside the published archive)
        if: matrix.primary
        run: dart test benchmark/test tool/test
      # The dependency floor, made real. `dart pub get` always resolves to the
      # newest allowed, so a lower bound in the pubspec is a claim nothing
      # checks — which is how `characters: ^1.4.0` stayed there while Flutter
      # stable pinned 1.3.0 and the package could not be installed at all
      # (issue #8). Only `characters` is downgraded: a blanket
      # `dart pub downgrade` takes the test tooling down with it, and those
      # floors do not compile against a current SDK.
      #
      # The two versions are not interchangeable — 1.3.0 carries the Unicode
      # 15 grapheme tables and 1.4.x carries Unicode 16 — so this run also
      # says that nothing in the package depends on which of them resolved.
      - name: Tests on the dependency floor
        if: matrix.primary
        run: dart pub downgrade characters && dart test
      # Back to what the ranges allow, which is what every other step in this
      # job runs against. There is no committed lock to return to — this is a
      # library, and the lock is deliberately local — so the downgraded one is
      # discarded and the graph resolved again.
      - name: Restore the resolution the ranges allow
        if: matrix.primary
        run: rm -f pubspec.lock && dart pub get
      - name: Example runs
        run: dart run example/format_example.dart
      - name: Tests (format_intl)
        run: dart test
        working-directory: packages/format_intl
      - name: Published archive stands on its own
        if: matrix.primary
        # Reconstructs what pub would ship and analyzes and tests it there:
        # a local pass cannot see a .pubignore that drops a referenced path.
        run: dart run tool/verify_package_archive.dart
      - name: Publish dry-run
        if: matrix.primary
        run: dart pub publish --dry-run

  generated-artifacts:
    # Three committed files are produced by tools rather than written, and
    # nothing about them announces that they are stale. This job regenerates
    # each one and compares; it needs an interpreter and a compiler the other
    # jobs do not, which is why it is separate rather than a step in `checks`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: '3.12.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The generators require CPython 3.14: the fixtures record what that
          # version does, and the identifier tables come from the Unicode
          # database it ships. A patch release is tolerated, a minor one is not.
          python-version: '3.14'
      - name: Resolve dependencies
        run: dart pub get
      - name: Comparison self-test
        # A checker that reports success because it compared a file with
        # itself would look exactly like a clean repository.
        run: dart run tool/verify_generated_artifacts.dart --self-test
      - name: Generated artifacts match their generators
        run: dart run tool/verify_generated_artifacts.dart --python=python

  coverage:
    # A green run says nothing about which branches never executed. This job
    # measures, prints the per-file table worst first, and holds the total to a
    # floor. Separate from `checks` because it reruns the suite under the VM
    # service, which is slower and would double the matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: '3.12.2'
      - name: Resolve dependencies
        run: dart pub get
      - name: Report self-test
        # A checker that reported 100% because it parsed nothing would look
        # exactly like a well-covered repository.
        run: dart run tool/check_coverage.dart --self-test
      - name: Measure
        # VM only: coverage is collected through the VM service, which dart2js
        # output has none of. The web-only branches are unreachable here by
        # construction and are pinned by the node run instead.
        run: dart test --coverage=.coverage
      - name: Convert to LCOV
        run: >-
          dart run coverage:format_coverage --lcov --in=.coverage
          --out=coverage/lcov.info --report-on=lib
          --packages=.dart_tool/package_config.json
      - name: Report and enforce the floor
        run: dart run tool/check_coverage.dart --lcov=coverage/lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Kept whether the floor held or not: the report is how the gap gets
        # closed, and it is most wanted on the run that failed.
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  benchmark-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: '3.12.2'
      - name: Resolve root dependencies
        run: dart pub get
      - name: Materialize the format 1.6.0 baseline from pub
        run: dart run benchmark/baselines/format16/fetch.dart
      - name: Resolve suite dependencies
        run: dart pub get
        working-directory: benchmark/suite
      - name: Analyze (full repository)
        # `--fatal-infos` here as well as in `checks`, so the baseline the
        # comment above claims is the one that is actually enforced. What this
        # pass adds over that one is `benchmark/` and `benchmark/suite/`, which
        # need the format16 baseline and the suite's own dependencies resolved
        # — both done in the steps above. The vendored baselines themselves are
        # excluded in `analysis_options.yaml`, where the reason is recorded.
        run: dart analyze --fatal-infos
      - name: Tests (benchmark suite)
        run: dart test
        working-directory: benchmark/suite
      # The matrix itself on all three runtimes. Nobody reads these numbers in
      # CI — the point is that the suite still starts everywhere, since two of
      # the three paths compile the package afresh and only ever break at the
      # compiler. Quick mode; a measurement worth recording is the gate's job.
      - name: Comparison matrix (Dart VM)
        run: dart run tool/run.dart --runtime=vm
        working-directory: benchmark/suite
      - name: Comparison matrix (dart2js)
        run: dart run tool/run.dart --runtime=js
        working-directory: benchmark/suite
      - name: Comparison matrix (dart2wasm)
        run: dart run tool/run.dart --runtime=wasm
        working-directory: benchmark/suite

  performance-gate:
    # On demand, and nightly once the schedule above is enabled: six full
    # measurement runs take minutes, and shared runners are noisy enough that
    # gating every pull request on them would cost more trust than it buys.
    #
    # Run this manually to produce the reports a first reference is recorded
    # from; see benchmark/results/README.md.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: '3.12.2'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned because JavaScript performance moves between Node releases,
          # so an upgrade invalidates the recorded reference rather than
          # beating it. The gate no longer holds this number itself: it
          # compares the Node a run used with the Node its reference was
          # recorded on, and a mismatch makes the run undecidable rather than
          # failed. Bumping here without re-recording is what that catches.
          node-version: 24.8.0
      - name: Resolve dependencies
        run: dart pub get
      - name: Measure
        run: |
          set -eux
          revision="$(git rev-parse HEAD)"
          define="-Dformat.benchmark.sourceRevision=$revision"
          for run in 1 2; do
            dart run "$define" benchmark/runner.dart \
              --runtime=jit --run="$run" --output="jit-$run.json"
          done
          dart compile exe "$define" benchmark/runner.dart -o benchmark-aot
          for run in 1 2; do
            ./benchmark-aot --runtime=aot --run="$run" --output="aot-$run.json"
          done
          compiler="$(dart --version 2>&1 | sed -E 's/.*version: ([^ ]+).*/\1/')"
          dart compile js -O4 \
            "-Dformat.benchmark.dartCompilerVersion=$compiler" \
            "$define" benchmark/runner.dart -o benchmark.js
          for run in 1 2; do
            node benchmark.js --runtime=js --run="$run" --output="js-$run.json"
          done
          dart compile wasm -O2 \
            "-Dformat.benchmark.dartCompilerVersion=$compiler" \
            "$define" benchmark/runner.dart -o benchmark.wasm
          for run in 1 2; do
            node benchmark/wasm_host.mjs benchmark.wasm \
              --runtime=wasm --run="$run" --output="wasm-$run.json"
          done
      - name: Evaluate against the recorded reference
        run: >-
          dart run benchmark/gates.dart
          --reports=jit-1.json,jit-2.json,aot-1.json,aot-2.json,js-1.json,js-2.json,wasm-1.json,wasm-2.json
          --baseline=benchmark/results/gate-baseline.json
          --output=gate-report.json
      # A run whose machine does not match the reference is not a pass: the
      # gate reports `comparable: false`, decides nothing and exits 0, so the
      # step goes green and the only trace is a line on stderr inside a
      # successful step. The project's own measurement says that is the common
      # case rather than the rare one — the reference model came up once in
      # four dispatches on 2026-08-12, and zero of two on 2026-08-13 — so a
      # night that decided nothing has to say so where the run summary shows
      # it. Still not a failure: nothing is wrong, the night simply proved
      # nothing.
      - name: Report whether the run decided anything
        if: always()
        run: |
          if [ ! -f gate-report.json ]; then
            echo "::warning::the gate produced no report"
            exit 0
          fi
          describe='--describe=gate-report.json'
          comparable="$(dart run benchmark/gates.dart "$describe")"
          if [ "$comparable" != 'comparable' ]; then
            echo "::warning::$comparable"
          fi
      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-gate
          path: |
            gate-report.json
            jit-*.json
            aot-*.json
            js-*.json
            wasm-*.json
