name: format_intl
description: Intl locale adapter for the format package.
version: 1.0.1
homepage: https://github.com/vi-k/format
repository: https://github.com/vi-k/format
issue_tracker: https://github.com/vi-k/format/issues
topics:
  - string
  - formatting
  - intl
  - i18n
  - localization
environment:
  sdk: ^3.6.0
resolution: workspace
dependencies:
  # Works with both majors: this package implements NumberLocale, which
  # 4.0.0 did not change.
  format: '>=3.0.0 <5.0.0'
  intl: ^0.20.2
dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.14
