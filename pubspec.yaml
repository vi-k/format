name: format
description: Dart string formatting with Python-style braces and printf mini-languages.
version: 3.0.0
repository: https://github.com/vi-k/format
issue_tracker: https://github.com/vi-k/format/issues
topics:
  - string
  - formatting
  - printf
  - sprintf
  - interpolation
environment:
  sdk: ^3.7.2
workspace:
  - packages/format_intl
dependencies:
  characters: ^1.3.0
dev_dependencies:
  lints: ^4.0.0
  # Exact pin: the frozen competitor baseline for the benchmark harness.
  # Bumping it invalidates comparability with recorded benchmark numbers.
  sprintf: 7.0.0
  test: ^1.25.14
